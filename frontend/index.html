<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MediChain — Medical Report Integrity</title>
  <link rel="stylesheet" href="css/carbon.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/hci.css">
  <link rel="stylesheet" href="css/app-theme.css">
  <link rel="stylesheet" href="css/green-motion.css">
  <link rel="stylesheet" href="css/concept.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <div class="landing">
    <section class="landing__hero">
      <div class="landing__hero-inner">
        <div class="landing-brandmark" aria-hidden="true">
          <svg class="landing-brandmark__glyph" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor" d="M48 6L14 22v22c0 22 15.4 41.8 34 46 18.6-4.2 34-24 34-46V22L48 6zm0 8.4L76 28v16c0 17.2-12.2 33.4-28 37.2C32.2 77.4 20 61.2 20 44V28l28-13.6z"/>
            <path fill="currentColor" d="M44 34h8v10h10v8H52v10h-8V52H34v-8h10V34z"/>
            <circle cx="48" cy="48" r="38" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
          </svg>
          <span class="landing-brandmark__ring"></span>
          <span class="landing-brandmark__ring landing-brandmark__ring--delay"></span>
        </div>
        <div class="landing__hero-copy">
          <h1 class="landing__title">MediChain</h1>
          <p class="landing__lead">Seal. Link. Verify.</p>
          <div class="landing__actions">
            <a class="btn btn--primary" href="#verify">Verify report</a>
            <a class="btn btn--secondary" href="login.html">Sign in</a>
          </div>
        </div>
      </div>
    </section>

    <div class="landing__body">
      <section class="landing-feats" aria-label="Core features">
        <div class="landing-feat">
          <span class="landing-feat__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3l8 4v5c0 5-3.4 9.4-8 10-4.6-.6-8-5-8-10V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
          </span>
          <span class="landing-feat__label">Seal</span>
        </div>
        <div class="landing-feat">
          <span class="landing-feat__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="8.5" y="13" width="7" height="7" rx="1.5"/><path d="M10 7.5h4M12 11v2"/></svg>
          </span>
          <span class="landing-feat__label">Hash chain</span>
        </div>
        <div class="landing-feat">
          <span class="landing-feat__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="16" r="3"/><path d="M18 14.5V16l1 1"/></svg>
          </span>
          <span class="landing-feat__label">QR verify</span>
        </div>
        <div class="landing-feat">
          <span class="landing-feat__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          </span>
          <span class="landing-feat__label">Alerts</span>
        </div>
        <div class="landing-feat">
          <span class="landing-feat__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
          </span>
          <span class="landing-feat__label">Integrity</span>
        </div>
      </section>

      <section id="verify" class="card landing-verify" aria-labelledby="landing-verify-title">
        <h2 class="card__title" id="landing-verify-title">Verify a medical report</h2>
        <p class="card__subtitle">Scan a QR, show a QR on this screen, or enter a Report ID.</p>

        <div id="notification-area"></div>

        <div class="verify-tabs" role="tablist" aria-label="Verification method">
          <button type="button" class="verify-tab is-active" role="tab" aria-selected="true" data-mode="scan" id="verify-tab-scan">Scan QR</button>
          <button type="button" class="verify-tab" role="tab" aria-selected="false" data-mode="show" id="verify-tab-show">Show QR</button>
          <button type="button" class="verify-tab" role="tab" aria-selected="false" data-mode="type" id="verify-tab-type">Enter ID</button>
        </div>

        <div id="verify-mode-scan" class="verify-mode">
          <div id="qr-reader" class="qr-reader"></div>
          <div class="verify-scan-actions">
            <button type="button" class="btn btn--primary" id="start-scan-btn">Start camera</button>
            <button type="button" class="btn btn--secondary" id="stop-scan-btn" hidden>Stop camera</button>
          </div>
        </div>

        <div id="verify-mode-show" class="verify-mode" hidden>
          <div class="verify-qr-panel">
            <div id="verify-qr-display" class="verify-qr-panel__code qr-code"></div>
            <p id="verify-qr-caption" class="verify-qr-panel__caption"></p>
            <p id="verify-qr-link" class="verify-qr-panel__link"></p>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="show-qr-id">Report ID</label>
            <div class="verify-qr-input-row">
              <input class="form-input" type="text" id="show-qr-id" placeholder="Report ID">
              <button type="button" class="btn btn--primary" id="show-qr-btn">Show QR</button>
            </div>
          </div>
        </div>

        <div id="verify-mode-type" class="verify-mode" hidden>
          <form id="verify-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="report-id">Medical Report ID</label>
              <input class="form-input" type="text" id="report-id" name="reportId" placeholder="Report ID">
            </div>
            <div class="form-actions" style="border-top: none; padding-top: 0;">
              <button type="submit" class="btn btn--secondary">Verify</button>
            </div>
          </form>
        </div>
      </section>

      <div id="verify-result"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/hci.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/verify.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderHeader('verify');

      if (new URLSearchParams(window.location.search).get('id')) {
        document.getElementById('verify')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  </script>
</body>
</html>
