<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notifications — MediChain</title>
  <link rel="stylesheet" href="css/carbon.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/hci.css">
  <link rel="stylesheet" href="css/app-theme.css">
  <link rel="stylesheet" href="css/green-motion.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main" style="max-width: 800px;">
      <div class="page-header">
        <p class="page-eyebrow">Alerts</p>
        <h1 class="page-header__title">Notifications</h1>
        <p class="page-header__subtitle">In-app alerts for reports, appointments, and contact messages.</p>
      </div>

      <div id="notification-area"></div>

      <div class="card card--inbox">
        <div class="inbox-toolbar">
          <div class="inbox-toolbar__meta">
            <h2 class="card__title">Your inbox</h2>
            <span id="unread-badge" class="tag tag--green">0 unread</span>
          </div>
          <div class="inbox-toolbar__actions">
            <button type="button" class="btn btn--ghost btn--sm inbox-btn" id="refresh-btn" aria-label="Refresh">
              <svg class="inbox-btn__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 2v3.5H10M2.5 14v-3.5H6M13.2 6A5.5 5.5 0 0 0 3.5 5.2M2.8 10a5.5 5.5 0 0 0 9.7.8" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square"/></svg>
              <span>Refresh</span>
            </button>
            <button type="button" class="btn btn--secondary btn--sm inbox-btn" id="mark-all-btn">
              <svg class="inbox-btn__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8.5 5.5 12 14 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
              <span class="inbox-btn__label-full">Mark all as read</span>
              <span class="inbox-btn__label-short">Mark all</span>
            </button>
          </div>
        </div>

        <div class="inbox-tabs" role="tablist" aria-label="Filter notifications">
          <button type="button" class="inbox-tab is-active" role="tab" aria-selected="true" data-filter="all">
            All <span class="inbox-tab__count" data-count="all">0</span>
          </button>
          <button type="button" class="inbox-tab" role="tab" aria-selected="false" data-filter="unread">
            Unread <span class="inbox-tab__count" data-count="unread">0</span>
          </button>
          <button type="button" class="inbox-tab" role="tab" aria-selected="false" data-filter="appointment">
            Appointments <span class="inbox-tab__count" data-count="appointment">0</span>
          </button>
          <button type="button" class="inbox-tab" role="tab" aria-selected="false" data-filter="report">
            Reports <span class="inbox-tab__count" data-count="report">0</span>
          </button>
          <button type="button" class="inbox-tab" role="tab" aria-selected="false" data-filter="contact">
            Contact <span class="inbox-tab__count" data-count="contact">0</span>
          </button>
        </div>

        <div id="notifications-list">
          <div class="empty-state">
            <div class="spinner" style="margin: 0 auto var(--space-04)"></div>
            <p>Loading notifications…</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/hci.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
